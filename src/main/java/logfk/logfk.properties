# Paths are relative to this file. Configuration is loaded once at startup.
root.level=INFO
logger.logfk.demo.level=DEBUG
logger.logfk.noisy.level=OFF
appenders=console,file

appender.console.type=CONSOLE
appender.console.level=DEBUG
appender.console.layout=TEXT
appender.console.target=STDERR

appender.file.type=FILE
appender.file.path=../../../../target/logfk-demo/application.jsonl
appender.file.level=INFO
appender.file.layout=JSON
appender.file.bufferSize=8192
appender.file.immediateFlush=false
appender.file.async=true
appender.file.queueCapacity=256
appender.file.overflowPolicy=BLOCK
appender.file.shutdownTimeoutMillis=5000
